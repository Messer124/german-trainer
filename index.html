<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="app-color-scheme" name="color-scheme" content="light dark" />
    <meta id="app-supported-color-schemes" name="supported-color-schemes" content="light dark" />
    <meta id="app-theme-color-light" name="theme-color" content="#ffffff" media="all" />
    <meta id="app-theme-color-dark" name="theme-color" content="#202124" media="not all" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta id="app-ios-status-bar-style" name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("app-theme") === "dark" ? "dark" : "light";
          var isDark = theme === "dark";
          var colorScheme = isDark ? "dark light" : "light dark";
          var lightThemeColor = "#ffffff";
          var darkThemeColor = "#202124";
          var backgroundColor = isDark ? "#050b1f" : "#f2f2f7";
          var statusBarStyle = isDark ? "black-translucent" : "default";
          var root = document.documentElement;
          var lightThemeMeta = document.getElementById("app-theme-color-light");
          var darkThemeMeta = document.getElementById("app-theme-color-dark");

          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          root.style.backgroundColor = backgroundColor;

          document.getElementById("app-color-scheme").setAttribute("content", colorScheme);
          document.getElementById("app-supported-color-schemes").setAttribute("content", colorScheme);
          lightThemeMeta.setAttribute("content", lightThemeColor);
          darkThemeMeta.setAttribute("content", darkThemeColor);
          lightThemeMeta.setAttribute("media", isDark ? "not all" : "all");
          darkThemeMeta.setAttribute("media", isDark ? "all" : "not all");
          document.getElementById("app-ios-status-bar-style").setAttribute("content", statusBarStyle);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <title>German Trainer</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
